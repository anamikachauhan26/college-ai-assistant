<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WCE College Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1115;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chat-container {
    width: 420px;
    height: 640px;
    background: #1a1d24;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .chat-header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    padding: 16px 20px;
    color: white;
  }
  .chat-header h1 { font-size: 16px; font-weight: 600; }
  .chat-header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

  .msg.user {
    align-self: flex-end;
    background: #4f46e5;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #262a34;
    color: #e5e7eb;
    border-bottom-left-radius: 4px;
  }
  .msg.bot .sources {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    color: #9ca3af;
    border-top: 1px solid #333;
    padding-top: 6px;
  }
  .typing {
    align-self: flex-start;
    background: #262a34;
    padding: 10px 14px;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 4px;
  }
  .typing span {
    width: 6px; height: 6px;
    background: #9ca3af;
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

  .chat-input {
    display: flex;
    padding: 12px;
    background: #1a1d24;
    border-top: 1px solid #2a2d35;
    gap: 8px;
  }
  .chat-input input {
    flex: 1;
    background: #262a34;
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    color: white;
    font-size: 14px;
    outline: none;
  }
  .chat-input input::placeholder { color: #6b7280; }
  .chat-input button {
    background: #4f46e5;
    border: none;
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .chat-input button:hover { background: #4338ca; }
  .chat-input button:disabled { background: #3a3d45; cursor: not-allowed; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h1>WCE Assistant</h1>
    <p>Ask about notices, exams, admissions & more</p>
  </div>

  <div class="chat-messages" id="messages">
    <div class="msg bot">Hi! I'm your college assistant. Ask me anything about notices, exams, admissions, or fees.</div>
  </div>

  <div class="chat-input">
    <input type="text" id="input" placeholder="Type your question..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  function addMessage(text, sender, sources = null) {
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.textContent = text;
    if (sources && sources.length) {
      const src = document.createElement('span');
      src.className = 'sources';
      src.textContent = 'Source: ' + sources.join(', ');
      div.appendChild(src);
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

    async function sendMessage() {
    const question = inputEl.value.trim();
    if (!question) return;

    addMessage(question, 'user');
    inputEl.value = '';
    sendBtn.disabled = true;

    const botDiv = document.createElement('div');
    botDiv.className = 'msg bot';
    messagesEl.appendChild(botDiv);
    showTyping();

    try {
      const res = await fetch('http://localhost:8000/ask-stream', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question})
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let fullText = '';
      let firstChunk = true;

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});
        const parts = buffer.split('\n\n');
        buffer = parts.pop();

        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          const data = JSON.parse(part.slice(6));

          if (data.chunk) {
            if (firstChunk) { hideTyping(); firstChunk = false; }
            fullText += data.chunk;
            botDiv.textContent = fullText;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }

          if (data.done && data.sources && data.sources.length) {
            const src = document.createElement('span');
            src.className = 'sources';
            src.textContent = 'Source: ' + data.sources.join(', ');
            botDiv.appendChild(src);
          }
        }
      }
    } catch (err) {
      hideTyping();
      botDiv.textContent = "Sorry, I couldn't reach the server. Is the backend running?";
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
  </script>

</body>
</html>
